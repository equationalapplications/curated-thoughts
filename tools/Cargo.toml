[package]
name = "curated-thoughts-tools"
version = "0.1.0"
edition = "2021"
description = "Developer and maintenance tools for Curated Thoughts (not bundled with the app)"

[dependencies]
tauri_app_lib = { path = "../src-tauri", package = "curated-thoughts" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
fs4 = "0.7"
anyhow = "1"
tokio = { version = "1", features = ["rt", "macros", "signal"] }
rmcp = { version = "3.1", features = ["macros", "transport-io", "schemars"] }
rusqlite = { version = "0.32", features = ["bundled"] }
schemars = { version = "1", features = ["derive"] }
walkdir = "2"
clap = { version = "4", features = ["derive"] }
# notify v6 + sha2: direct deps so `cmds.rs` can use them without relying on
# transitive resolution through `tauri_app_lib`. Both versions match the
# pins in `src-tauri/Cargo.toml` to keep the workspace on a single
# notification backend and a single SHA-2 implementation.
notify = "6"
sha2 = "0.11"
# Home-dir resolution for the trusted-links ledger. Matches the version
# pinned in src-tauri/Cargo.toml so behavior is identical between the
# app and the headless CLI.
dirs = "6"

[dev-dependencies]
tempfile = "3"
temp-env = "0.3"

[[bin]]
name = "embed_scifact"
path = "src/bin/embed_scifact.rs"

[[bin]]
name = "embed_bench_fixture"
path = "src/bin/embed_bench_fixture.rs"

[[bin]]
name = "gen_yaml_synthetic_bench"
path = "src/bin/gen_yaml_synthetic_bench.rs"

[[bin]]
name = "gen_yaml_k8s_curated_bench"
path = "src/bin/gen_yaml_k8s_curated_bench.rs"

[[bin]]
name = "gen_code_synthetic_bench"
path = "src/bin/gen_code_synthetic_bench.rs"

[[bin]]
name = "gen_code_curated_bench"
path = "src/bin/gen_code_curated_bench.rs"

[[bin]]
name = "curated-thoughts-mcp"
path = "src/bin/curated_thoughts_mcp.rs"

[[bin]]
name = "bulk_reindex"
path = "src/bin/bulk_reindex.rs"

[[bin]]
name = "ingest_vault_once"
path = "src/bin/ingest_vault_once.rs"

[[bin]]
name = "semantic_search_profile"
path = "src/bin/semantic_search_profile.rs"

[[bin]]
name = "ct"
path = "src/bin/ct.rs"
