[package]
name = "curated-thoughts-tools"
version = "0.1.0"
edition = "2021"
description = "Developer and maintenance tools for Curated Thoughts (not bundled with the app)"

[dependencies]
tauri_app_lib = { path = "../src-tauri", package = "curated-thoughts" }
serde.workspace = true
serde_json.workspace = true
flate2.workspace = true
fs4.workspace = true
anyhow.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "signal"] }
rmcp = { workspace = true, features = ["macros", "transport-io", "schemars"] }
rusqlite.workspace = true
schemars.workspace = true
walkdir.workspace = true
clap = { version = "4", features = ["derive"] }
# notify + sha2: direct deps so `cmds.rs` can use them without relying on
# transitive resolution through `tauri_app_lib`. Versions are enforced by
# [workspace.dependencies].
notify.workspace = true
sha2.workspace = true
# Home-dir resolution for the trusted-links ledger.
dirs.workspace = true

[dev-dependencies]
tempfile.workspace = true
temp-env.workspace = true

[[bin]]
name = "embed_scifact"
path = "src/bin/embed_scifact.rs"

[[bin]]
name = "embed_bench_fixture"
path = "src/bin/embed_bench_fixture.rs"

[[bin]]
name = "gen_yaml_synthetic_bench"
path = "src/bin/gen_yaml_synthetic_bench.rs"

[[bin]]
name = "gen_yaml_k8s_curated_bench"
path = "src/bin/gen_yaml_k8s_curated_bench.rs"

[[bin]]
name = "gen_code_synthetic_bench"
path = "src/bin/gen_code_synthetic_bench.rs"

[[bin]]
name = "gen_code_curated_bench"
path = "src/bin/gen_code_curated_bench.rs"

[[bin]]
name = "curated-thoughts-mcp"
path = "src/bin/curated_thoughts_mcp.rs"

[[bin]]
name = "bulk_reindex"
path = "src/bin/bulk_reindex.rs"

[[bin]]
name = "graph_reanchor"
path = "src/bin/graph_reanchor.rs"

[[bin]]
name = "ingest_vault_once"
path = "src/bin/ingest_vault_once.rs"

[[bin]]
name = "semantic_search_profile"
path = "src/bin/semantic_search_profile.rs"

[[bin]]
name = "tier_backfill"
path = "src/bin/tier_backfill.rs"

[[bin]]
name = "ct"
path = "src/bin/ct.rs"
