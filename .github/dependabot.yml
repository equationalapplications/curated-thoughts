version: 2
updates:
  - package-ecosystem: "npm" # pnpm-lock.yaml handled by the npm ecosystem
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      # Note: 14-day cooldown applies to direct Dependabot updates only.
      # Transitive dependencies updated via lockfile regeneration may still
      # include packages published <14 days ago. This is a known limitation.
      default-days: 14
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "cargo"
    directory: "/tools"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"