version: 2
updates:
  - package-ecosystem: "npm" # pnpm-lock.yaml handled by the npm ecosystem
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      # Note: 14-day cooldown applies to direct Dependabot updates only.
      # Transitive dependencies updated via lockfile regeneration may still
      # include packages published <14 days ago. This is a known limitation.
      default-days: 14
    ignore:
      # conventional-changelog-conventionalcommits@10 requires
      # conventional-changelog-writer@9 or newer. The writer is a TRANSITIVE
      # dep of @semantic-release/release-notes-generator, whose latest stable
      # (14.x) pins conventional-changelog-writer@^8. The writer@9 chain ships
      # only in prereleases -- release-notes-generator@15.0.0-beta.2 and
      # semantic-release@26.0.0-beta.1 -- so there is no stable upgrade path
      # today. Grouping alone does NOT protect this: the group can only move
      # packages Dependabot bumps directly, and it never bumps the transitive
      # writer, which is exactly how PR #155 landed the v10 preset against
      # writer@8 and left `release-config` failing on main.
      # Revisit when release-notes-generator ships a stable v15; at that point
      # drop this ignore AND the pnpm.overrides pin in package.json together.
      - dependency-name: "conventional-changelog-conventionalcommits"
        update-types: ["version-update:semver-major"]
    groups:
      # The release toolchain must move as a unit. conventional-changelog-writer
      # is a TRANSITIVE dep (pulled by release-notes-generator), so Dependabot
      # never bumps it alone -- which let PR #155 raise the conventionalcommits
      # preset to v10 while the writer that renders it stayed on v8, breaking
      # the release. major is included deliberately: majors are exactly what
      # minor-and-patch fails to cover.
      release-toolchain:
        patterns:
          - "semantic-release"
          - "@semantic-release/*"
          - "conventional-changelog-*"
        update-types:
          - "major"
          - "minor"
          - "patch"
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    ignore:
      # fastembed 6.x pulls ort 2.0.0-rc.13, whose prebuilt ONNX Runtime for
      # linux-x64 links against glibc >= 2.38 and a newer libstdc++. CI
      # (ci.yml) and release (build.yml) both build on ubuntu-22.04
      # (glibc 2.35), so the link fails with undefined `__isoc23_strtoll`.
      # The floor is imposed by the onnxruntime shared object at *runtime*,
      # not just at build time, so moving to ubuntu-24.04 would not remove it
      # -- it would break Ubuntu 22.04 (2.35) and Debian 12 (2.36) users.
      # Revisit when ort ships a prebuilt with a lower glibc floor, or as a
      # deliberate decision to drop those distros. See closed PR #138.
      - dependency-name: "fastembed"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "cargo"
    directory: "/tools"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"