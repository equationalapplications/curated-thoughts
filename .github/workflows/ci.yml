name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust-ubuntu:
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: outbox_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - name: Install Linux dependencies (Tauri / WebKit)
        run: |
          # The GitHub-hosted Ubuntu 22.04 image ships `azure.archive.ubuntu.com`
          # as a primary mirror, which times out from runner hosts and stalls
          # `apt-get update` indefinitely (seen twice in 2026-08 — both the
          # post-merge run and its rerun hit the 6h runner ceiling waiting on
          # this mirror's package-list fetch). Strip the broken host from every
          # sources file so apt never tries it, then bound the overall update
          # with a hard timeout as a safety net against future mirror issues.
          sudo find /etc/apt -type f \
            \( -name '*.list' -o -name '*.sources' -o -name 'apt-mirrors.txt' \) \
            -exec sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' {} +
          sudo timeout 5m apt-get \
            -o Acquire::http::Timeout=120 \
            -o Acquire::https::Timeout=120 \
            -o Acquire::Retries=0 \
            update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            pkg-config libssl-dev libpq-dev

      - uses: ./.github/actions/setup-node-pnpm

      - name: Install Node dependencies (DDL compat test)
        run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable # intentional rolling stable; see spec Post-execution outcomes

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: ./src-tauri -> target

      # Phase 4 regression tests run here:
      #   graph_integration.rs  — recursive impact radius (5-hop CTE via Tauri command)
      #   wiki_maintenance.rs   — DB-level prune/heal SQL contract
      # Before addressing PR review comments that touch graph.rs CTEs, lib.rs
      # run_wiki_heal/run_wiki_prune SQL, or the max_hops cap: run this step
      # locally first to confirm no regression.
      # mcp-server feature included so cargo builds curated-thoughts with --mcp support;
      # cargo sets CARGO_BIN_EXE_curated_thoughts automatically for mcp_integration.rs.
      - name: Tests + MCP integration
        run: cargo test --manifest-path src-tauri/Cargo.toml --features test-utils,mcp-server -- --test-threads=1
        env:
          CURATED_MCP_INTEGRATION_TESTS: "1"
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/outbox_test

      - name: Outbox Postgres integration tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --features test-utils,mcp-server --lib outbox -- --test-threads=1
        env:
          OUTBOX_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/outbox_test
          DATABASE_URL: ""

  rust-macos:
    permissions:
      contents: read
      actions: write
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - uses: ./.github/actions/setup-node-pnpm

      - name: Install Node dependencies (DDL compat test)
        run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable # intentional rolling stable; see spec Post-execution outcomes

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: ./src-tauri -> target

      - name: Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --features test-utils,mcp-server -- --test-threads=1
        env:
          CURATED_MCP_INTEGRATION_TESTS: "1"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - uses: ./.github/actions/setup-node-pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck + Vite build
        run: pnpm run build

      - name: Vitest
        run: pnpm test
