name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust-ubuntu:
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: outbox_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Linux dependencies (Tauri / WebKit)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            pkg-config libssl-dev libpq-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      # Phase 4 regression tests run here:
      #   graph_integration.rs  — recursive impact radius (5-hop CTE via Tauri command)
      #   wiki_maintenance.rs   — DB-level prune/heal SQL contract
      # Before addressing PR review comments that touch graph.rs CTEs, lib.rs
      # run_wiki_heal/run_wiki_prune SQL, or the max_hops cap: run this step
      # locally first to confirm no regression.
      # mcp-server feature included so cargo builds curated-thoughts with --mcp support;
      # cargo sets CARGO_BIN_EXE_curated_thoughts automatically for mcp_integration.rs.
      - name: Tests + MCP integration
        run: cargo test --manifest-path src-tauri/Cargo.toml --features test-utils,mcp-server -- --test-threads=1
        env:
          CURATED_MCP_INTEGRATION_TESTS: "1"
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/outbox_test

      - name: Outbox Postgres integration tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --features test-utils outbox -- --test-threads=1
        env:
          CURATED_MCP_INTEGRATION_TESTS: "1"
          OUTBOX_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/outbox_test
          DATABASE_URL: ""

  rust-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --features test-utils,mcp-server
        env:
          CURATED_MCP_INTEGRATION_TESTS: "1"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck + Vite build
        run: pnpm run build

      - name: Vitest
        run: pnpm test
