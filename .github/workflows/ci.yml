name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
          - os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies (Tauri / WebKit)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            pkg-config libssl-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            ./src-tauri -> target
            ./tools -> target

      - name: Build MCP binary
        run: cargo build --manifest-path tools/Cargo.toml --bin curated-thoughts-mcp

      # Phase 4 regression tests run here:
      #   graph_integration.rs  — recursive impact radius (5-hop CTE via Tauri command)
      #   wiki_maintenance.rs   — DB-level prune/heal SQL contract
      # Before addressing PR review comments that touch graph.rs CTEs, lib.rs
      # run_wiki_heal/run_wiki_prune SQL, or the max_hops cap: run this step
      # locally first to confirm no regression.
      - name: Tests + MCP integration
        run: cargo test --manifest-path src-tauri/Cargo.toml --features test-utils
        env:
          CURATED_MCP_INTEGRATION_TESTS: "1"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck + Vite build
        run: pnpm run build

      - name: Vitest
        run: pnpm test
