name: Dependency release age

# Policy (docs/superpowers/specs/2026-08-27-supply-chain-version-policy.md,
# Control 1 — 14-day release-age gate): a PR's Cargo.lock delta vs the
# base branch must contain no registry version published in the last 14 days,
# to limit exposure to poisoned upstream releases. A PR whose delta is empty
# passes without a cooldown; whole-lockfile sweeps stay available as manual
# `workflow_dispatch` audits (timeout raised for that path — a full sweep of
# ~750 crates costs one spaced request each, well past 10 minutes).
# Fail-closed: a version whose registry timestamp cannot be determined fails
# the check, and a PR that ADDS a git-source dependency fails (no registry
# timestamp exists for git deps). The PR runs the BASE branch's copy of the
# gate script so it cannot weaken its own gate by editing the script; on the
# first PR that introduces the script, the base has no copy yet and the PR's
# copy is used (nothing committed to weaken). Runs before any cargo/pip
# install, so a too-new package's build scripts never execute in CI. The JS
# side is already gated by pnpm-workspace.yaml `minimumReleaseAge` and is not
# re-checked here. curated-thoughts has no Python lockfile today; the script
# covers requirements*.txt / uv.lock / poetry.lock if one ever lands.
on:
  pull_request:
    paths:
      - Cargo.lock
      - "src-tauri/Cargo.toml"
      - "tools/Cargo.toml"
      - "requirements*.txt"
      - uv.lock
      - poetry.lock
      - scripts/check-release-age-cargo-py.mjs
      - .github/workflows/dependency-release-age.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 45 || 10 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history so the base branch ref is present for the delta
          # diff; `git show` afterwards needs no credentials.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Check minimum release age
        env:
          BASE_REF: origin/${{ github.event.pull_request.base.ref }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            # Run the BASE branch's copy of the gate script so the PR under
            # review cannot weaken its own gate by editing the script. On the
            # first PR that introduces the script the base has no copy yet —
            # fall back to the PR's copy (nothing committed to weaken).
            if git cat-file -e "$BASE_REF:scripts/check-release-age-cargo-py.mjs" 2>/dev/null; then
              git show "$BASE_REF:scripts/check-release-age-cargo-py.mjs" > "$RUNNER_TEMP/check-release-age-cargo-py.mjs"
            else
              cp scripts/check-release-age-cargo-py.mjs "$RUNNER_TEMP/check-release-age-cargo-py.mjs"
            fi
            GATE="$RUNNER_TEMP/check-release-age-cargo-py.mjs"
          else
            GATE="scripts/check-release-age-cargo-py.mjs"
          fi
          # Check every lockfile present (Cargo.lock today; requirements*.txt
          # / uv.lock / poetry.lock if one ever lands — the paths: filter
          # above already triggers on them).
          found=0
          for lf in Cargo.lock requirements*.txt uv.lock poetry.lock; do
            [ -f "$lf" ] || continue
            found=1
            if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
              node "$GATE" --days 14 --lockfile "$lf" --base "$BASE_REF"
            else
              node "$GATE" --days 14 --lockfile "$lf"
            fi
          done
          if [ "$found" != 1 ]; then
            echo "No lockfile found to age-check (expected Cargo.lock or a Python lockfile)" >&2
            exit 1
          fi
