name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "37 6 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, rust]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux dependencies (Tauri / WebKit)
        if: matrix.language == 'rust'
        run: |
          sudo find /etc/apt -type f \
            \( -name '*.list' -o -name '*.sources' -o -name 'apt-mirrors.txt' \) \
            -exec sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' {} +
          sudo timeout 5m apt-get \
            -o Acquire::http::Timeout=120 \
            -o Acquire::https::Timeout=120 \
            -o Acquire::Retries=0 \
            update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf pkg-config libssl-dev

      - uses: github/codeql-action/init@42947a340483f03ba47bb1a039b2c519aab3df85 # v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - if: matrix.language == 'rust'
        uses: github/codeql-action/autobuild@42947a340483f03ba47bb1a039b2c519aab3df85 # v3

      - uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          category: "/language:${{ matrix.language }}"
