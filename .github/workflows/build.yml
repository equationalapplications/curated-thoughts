name: Build

on:
  push:
    # Release builds are started by the workflow_dispatch that release.yml's
    # dispatch-build job sends. semantic-release's tag push uses an App token
    # and may also fire this trigger; the concurrency group below keeps one
    # build. This trigger exists for tags pushed by a human credential.
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    # Code signing (see docs/release-signing.md). Each switch is "true" only
    # when its secrets are configured, so builds stay green (unsigned) until
    # the Apple / Azure accounts exist. Signing runs only on tag builds.
    # Each gate requires EVERY secret/variable its signing step consumes, so a
    # partially configured repo degrades to a green unsigned build instead of
    # failing a tag release mid-run (docs/release-signing.md promise).
    env:
      MAC_SIGNING: ${{ github.ref_type == 'tag' && secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_API_PRIVATE_KEY != '' && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER != '' }}
      WIN_SIGNING: ${{ github.ref_type == 'tag' && secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_CLIENT_SECRET != '' && secrets.AZURE_TENANT_ID != '' && vars.AZURE_SIGNING_ENDPOINT != '' && vars.AZURE_SIGNING_ACCOUNT != '' && vars.AZURE_SIGNING_PROFILE != '' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          # The GitHub-hosted Ubuntu 22.04 image ships `azure.archive.ubuntu.com`
          # as a primary mirror, which times out from runner hosts and stalls
          # `apt-get update` indefinitely. Strip the broken host from every
          # sources file so apt never tries it, then bound the overall update
          # with a hard timeout as a safety net against future mirror issues.
          sudo find /etc/apt -type f \
            \( -name '*.list' -o -name '*.sources' -o -name 'apt-mirrors.txt' \) \
            -exec sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' {} +
          sudo timeout 5m apt-get \
            -o Acquire::http::Timeout=120 \
            -o Acquire::https::Timeout=120 \
            -o Acquire::Retries=0 \
            update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable # intentional rolling stable; see spec Post-execution outcomes
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: ". -> target"

      # Imports the Developer ID Application cert into a throwaway keychain
      # and exports APPLE_SIGNING_IDENTITY + the notarytool API key for both
      # the ct CLI step and the Tauri bundler (which signs the app, the MCP
      # sidecar, notarizes and staples). APPLE_CERTIFICATE is deliberately
      # NOT passed to tauri-action, so there is exactly one keychain import.
      - name: Import Apple signing certificate (macOS)
        if: matrix.platform == 'macos-latest' && env.MAC_SIGNING == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          CERT="$RUNNER_TEMP/cert.p12"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$CERT"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$CERT"
          # `|| true` so a no-identity keychain reaches the explicit check
          # below instead of set -e aborting first (xhigh finding).
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')" || true
          if [ -z "$IDENTITY" ]; then
            echo "::error::no 'Developer ID Application' identity in APPLE_CERTIFICATE" >&2
            exit 1
          fi
          KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$KEY_PATH"
          {
            echo "APPLE_SIGNING_IDENTITY=$IDENTITY"
            echo "APPLE_API_KEY=$APPLE_API_KEY_ID"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
            echo "APPLE_API_KEY_PATH=$KEY_PATH"
          } >> "$GITHUB_ENV"

      # Installs the Azure Artifact Signing client and writes
      # src-tauri/tauri.windows.conf.json, which Tauri merges automatically on
      # Windows builds. The file exists only on signed CI runs, so unsigned and
      # local builds never see a signCommand. Account/profile/endpoint are
      # repository *variables* (not secret); credentials are secrets.
      - name: Set up Windows code signing
        if: matrix.platform == 'windows-latest' && env.WIN_SIGNING == 'true'
        shell: bash
        env:
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
        run: |
          set -euo pipefail
          cargo install artifact-signing-cli --locked --version 0.12.0
          jq -n \
            --arg e "$AZURE_SIGNING_ENDPOINT" \
            --arg a "$AZURE_SIGNING_ACCOUNT" \
            --arg c "$AZURE_SIGNING_PROFILE" \
            '{bundle: {windows: {signCommand: {cmd: "artifact-signing-cli", args: ["-e", $e, "-a", $a, "-c", $c, "-d", "Curated Thoughts", "%1"]}}}}' \
            > src-tauri/tauri.windows.conf.json
          cat src-tauri/tauri.windows.conf.json

      - name: Build MCP sidecar
        if: matrix.platform != 'macos-latest'
        shell: bash
        run: |
          set -euxo pipefail
          # Placeholder satisfies tauri-build's externalBin check, which runs
          # inside the same cargo build that produces the real sidecar.
          mkdir -p src-tauri/binaries
          case "${{ matrix.platform }}" in
            ubuntu-*)
              touch src-tauri/binaries/curated-thoughts-mcp-x86_64-unknown-linux-gnu ;;
            windows-*)
              touch src-tauri/binaries/curated-thoughts-mcp-x86_64-pc-windows-msvc.exe ;;
          esac
          cargo build --release --manifest-path src-tauri/Cargo.toml \
            --features mcp-server --bin curated-thoughts
          TARGET_DIR="$(cargo metadata --format-version 1 --no-deps | jq -r .target_directory)"
          case "${{ matrix.platform }}" in
            ubuntu-*)
              SRC="$TARGET_DIR/release/curated-thoughts"
              DEST=src-tauri/binaries/curated-thoughts-mcp-x86_64-unknown-linux-gnu
              ;;
            windows-*)
              SRC="$TARGET_DIR/release/curated-thoughts.exe"
              DEST=src-tauri/binaries/curated-thoughts-mcp-x86_64-pc-windows-msvc.exe
              ;;
            *)
              echo "Unsupported platform: ${{ matrix.platform }}" >&2
              exit 1
              ;;
          esac
          # cp onto the existing placeholder preserves its 0644 mode, so
          # restore the exec bit explicitly (smoke test requires -x).
          cp "$SRC" "$DEST"
          chmod +x "$DEST"

      - name: Smoke test MCP sidecar
        if: matrix.platform == 'ubuntu-22.04'
        # The server requires an existing brain DB + embed profile before it
        # will serve; CI has no real brain, so seed a minimal one.
        run: |
          mkdir -p ~/.brain
          printf '{"embed_profile":{"type":"local","model":"smoke-test"},"vault_path":null}' > ~/.brain/config.json
          python3 -c "import sqlite3; sqlite3.connect('$HOME/.brain/brain.db').execute('CREATE TABLE IF NOT EXISTS chunks (id INTEGER PRIMARY KEY)')"
          ./tools/smoke_test_mcp_sidecar.sh src-tauri/binaries/curated-thoughts-mcp-x86_64-unknown-linux-gnu

      - name: Build MCP sidecar (macOS universal)
        if: matrix.platform == 'macos-latest'
        run: |
          set -euxo pipefail
          # Placeholders satisfy tauri-build's externalBin check, which runs
          # inside each cargo build that produces the real sidecar slices.
          mkdir -p src-tauri/binaries
          touch src-tauri/binaries/curated-thoughts-mcp-aarch64-apple-darwin
          touch src-tauri/binaries/curated-thoughts-mcp-x86_64-apple-darwin
          # The bundler resolves externalBin against the universal triple.
          touch src-tauri/binaries/curated-thoughts-mcp-universal-apple-darwin
          for T in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --manifest-path src-tauri/Cargo.toml \
              --features mcp-server --bin curated-thoughts --target $T
          done
          mkdir -p src-tauri/binaries
          TARGET_DIR="$(cargo metadata --format-version 1 --no-deps | jq -r .target_directory)"
          lipo -create \
            "$TARGET_DIR/aarch64-apple-darwin/release/curated-thoughts" \
            "$TARGET_DIR/x86_64-apple-darwin/release/curated-thoughts" \
            -output src-tauri/binaries/curated-thoughts-mcp-universal-apple-darwin
          lipo -info src-tauri/binaries/curated-thoughts-mcp-universal-apple-darwin

      - name: Derive version
        id: ctver
        # bash syntax (jq, $GITHUB_OUTPUT, [ ]) — without this, the Windows
        # leg runs `run:` under pwsh and dies before tauri-action ever fires.
        shell: bash
        run: |
          VERSION="$(jq -r .version src-tauri/tauri.conf.json)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [ "${VERSION}" != "${TAG_VERSION}" ]; then
              echo "::error::tag ${GITHUB_REF_NAME} but tauri.conf.json says ${VERSION}" >&2
              exit 1
            fi
          fi

      - name: Build ct CLI
        if: matrix.platform != 'macos-latest'
        id: ctbuild
        shell: bash
        env:
          # NOTE (xhigh): no signing secrets here — the ct step runs a cargo
          # build whose build.rs scripts must never see AZURE_CLIENT_SECRET.
          # Signing lives in the dedicated "Sign Windows ct CLI + MCP sidecar"
          # step below.
        run: |
          set -euo pipefail
          cargo build --release -p curated-thoughts-tools --bin ct
          TARGET_DIR="$(cargo metadata --format-version 1 --no-deps | jq -r .target_directory)"
          case "${{ matrix.platform }}" in
            ubuntu-22.04) OS=linux; ARCH=amd64; EXT=tar.gz ;;
            windows-latest) OS=windows; ARCH=amd64; EXT=zip ;;
            *) echo "Unsupported platform: ${{ matrix.platform }}" >&2; exit 1 ;;
          esac
          ASSET="ct_${{ steps.ctver.outputs.version }}_${OS}_${ARCH}.${EXT}"
          echo "asset=${ASSET}" >> "$GITHUB_OUTPUT"
          # Spec :38-41 — every archive carries a short README alongside the binary.
          printf 'ct: the Curated Thoughts headless CLI. See the repo README for usage.\n' > README.txt
          if [ "${EXT}" = "zip" ]; then
            # NO archive here (sonnet-high BLOCKER): ct.exe is signed by the
            # NEXT step, and the zip must carry the SIGNED binary — packaging
            # happens in "Package Windows ct CLI" after signing. Stage the
            # README next to the exe for that step.
            cp README.txt "${TARGET_DIR}/release/README.txt"
          else
            # Copy next to the binary so tar needs a single -C (OLDPWD is
            # unset under `set -u` when bash never cd'd — unbound-variable
            # abort, review B1).
            cp README.txt "${TARGET_DIR}/release/README.txt"
            tar czf "${ASSET}" -C "${TARGET_DIR}/release" ct README.txt
          fi

      - name: Sign Windows ct CLI + MCP sidecar
        # Dedicated step so AZURE_CLIENT_SECRET exists only where signing
        # happens (xhigh finding) — never in the cargo-build env above.
        # The MCP sidecar is signed here, before Tauri bundles it, rather than
        # relying on the bundler to sign externalBin entries.
        if: matrix.platform == 'windows-latest' && env.WIN_SIGNING == 'true'
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
        run: |
          set -euo pipefail
          TARGET_DIR="$(cargo metadata --format-version 1 --no-deps | jq -r .target_directory)"
          artifact-signing-cli -e "$AZURE_SIGNING_ENDPOINT" -a "$AZURE_SIGNING_ACCOUNT" -c "$AZURE_SIGNING_PROFILE" \
            -d "Curated Thoughts CLI" "${TARGET_DIR}/release/ct.exe"
          artifact-signing-cli -e "$AZURE_SIGNING_ENDPOINT" -a "$AZURE_SIGNING_ACCOUNT" -c "$AZURE_SIGNING_PROFILE" \
            -d "Curated Thoughts MCP server" \
            src-tauri/binaries/curated-thoughts-mcp-x86_64-pc-windows-msvc.exe

      - name: Package Windows ct CLI
        # AFTER signing, so the zip carries the SIGNED ct.exe (sonnet-high
        # BLOCKER: the old zip was built before the sign step and shipped the
        # unsigned binary while the on-disk verify checked the signed one).
        # Runs on unsigned runs too — packaging is not a signing concern.
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          TARGET_DIR="$(cargo metadata --format-version 1 --no-deps | jq -r .target_directory)"
          ASSET="ct_${{ steps.ctver.outputs.version }}_windows_amd64.zip"
          test -f "${TARGET_DIR}/release/README.txt"
          pwsh -NoProfile -Command "Compress-Archive -Path '${TARGET_DIR}/release/ct.exe','${TARGET_DIR}/release/README.txt' -DestinationPath '${ASSET}'"

      - name: Build ct CLI (macOS universal)
        if: matrix.platform == 'macos-latest'
        id: ctbuildmac
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release -p curated-thoughts-tools --bin ct --target aarch64-apple-darwin
          cargo build --release -p curated-thoughts-tools --bin ct --target x86_64-apple-darwin
          TARGET_DIR="$(cargo metadata --format-version 1 --no-deps | jq -r .target_directory)"
          lipo -create \
            "${TARGET_DIR}/aarch64-apple-darwin/release/ct" \
            "${TARGET_DIR}/x86_64-apple-darwin/release/ct" \
            -output "${TARGET_DIR}/ct-universal"
          lipo -info "${TARGET_DIR}/ct-universal"
          # Stage under the user-facing name so the archive unpacks to `ct`,
          # not `ct-universal` (spec: each archive holds the binary + README).
          cp "${TARGET_DIR}/ct-universal" "${TARGET_DIR}/ct"
          if [ "${MAC_SIGNING}" = "true" ]; then
            codesign --force --options runtime --timestamp \
              --sign "$APPLE_SIGNING_IDENTITY" "${TARGET_DIR}/ct"
            codesign --verify --strict --verbose=2 "${TARGET_DIR}/ct"
            # A bare Mach-O cannot be stapled; notarizing it registers the
            # ticket with Apple so Gatekeeper accepts it online.
            ditto -c -k --keepParent "${TARGET_DIR}/ct" "${RUNNER_TEMP}/ct-notarize.zip"
            xcrun notarytool submit "${RUNNER_TEMP}/ct-notarize.zip" \
              --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" \
              --issuer "$APPLE_API_ISSUER" --wait
          fi
          ASSET="ct_${{ steps.ctver.outputs.version }}_macos_universal.tar.gz"
          echo "asset=${ASSET}" >> "$GITHUB_OUTPUT"
          printf 'ct: the Curated Thoughts headless CLI. See the repo README for usage.\n' > "${TARGET_DIR}/README.txt"
          tar czf "${ASSET}" -C "${TARGET_DIR}" ct README.txt

      - name: Smoke test ct CLI
        shell: bash
        run: |
          TARGET_DIR="$(cargo metadata --format-version 1 --no-deps | jq -r .target_directory)"
          BIN="${TARGET_DIR}/release/ct"
          if [ "${{ matrix.platform }}" = "macos-latest" ]; then BIN="${TARGET_DIR}/ct-universal"; fi
          "${BIN}" --help > /dev/null

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        if: github.ref_type == 'tag'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Used by signCommand on signed Windows runs only (see setup step);
          # gated to the Windows leg (least privilege).
          AZURE_CLIENT_ID: ${{ matrix.platform == 'windows-latest' && env.WIN_SIGNING == 'true' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ matrix.platform == 'windows-latest' && env.WIN_SIGNING == 'true' && secrets.AZURE_CLIENT_SECRET || '' }}
          AZURE_TENANT_ID: ${{ matrix.platform == 'windows-latest' && env.WIN_SIGNING == 'true' && secrets.AZURE_TENANT_ID || '' }}
        with:
          tauriScript: pnpm tauri
          tagName: v__VERSION__
          releaseName: "Curated Thoughts v__VERSION__"
          releaseBody: "See the assets below to download and install this version."
          # Draft first: the release goes public only via the publish-release
          # job AFTER every matrix leg built, verified, and uploaded — so a
          # silently unsigned/invalid artifact fails the build and the release
          # never goes public (docs/release-signing.md gate promise).
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Verify macOS signature and notarization
        if: matrix.platform == 'macos-latest' && env.MAC_SIGNING == 'true'
        run: |
          set -euo pipefail
          TARGET_DIR="$(cargo metadata --format-version 1 --no-deps | jq -r .target_directory)"
          APP="$(find "$TARGET_DIR/universal-apple-darwin/release/bundle/macos" -maxdepth 1 -name '*.app' | head -1)"
          codesign --verify --deep --strict --verbose=2 "$APP"
          sidecar_info="$(codesign -dv "$APP/Contents/MacOS/curated-thoughts-mcp" 2>&1)"
          grep -q 'Developer ID Application' <<<"$sidecar_info"
          spctl --assess --type execute --verbose=2 "$APP"
          xcrun stapler validate "$APP"
          # The .dmg and the ct CLI are signed+notarized artifacts too
          # (docs/release-signing.md table) — verify them, don't trust.
          DMG="$(find "$TARGET_DIR/universal-apple-darwin/release/bundle/dmg" -maxdepth 1 -name '*.dmg' | head -1)"
          test -n "$DMG"
          # The bundler CODESIGNS the dmg but never staples it (tauri v2.12.5
          # dmg/mod.rs) — the stapled ticket rides on the .app inside, which IS
          # stapled before dmg creation (app.rs notarize()). `stapler validate`
          # on the dmg would fail every signed release; verify sig+authority.
          dmg_info="$(codesign -dv "$DMG" 2>&1)"
          grep -q 'Developer ID Application' <<<"$dmg_info"
          codesign --verify --strict --verbose=2 "$DMG"
          # Bare Mach-O can never hold a staple — `stapler validate` would
          # always fail (the ct build step notarizes via `notarytool submit
          # --wait`, which IS the gate). Verify the signature + authority.
          ct_info="$(codesign -dv "${TARGET_DIR}/ct" 2>&1)"
          grep -q 'Developer ID Application' <<<"$ct_info"
          codesign --verify --strict --verbose=2 "${TARGET_DIR}/ct"

      - name: Verify Windows signatures
        if: matrix.platform == 'windows-latest' && env.WIN_SIGNING == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $targetDir = (cargo metadata --format-version 1 --no-deps | ConvertFrom-Json).target_directory
          # Assert each expected artifact class actually exists — a wildcard
          # with zero matches would otherwise check nothing and pass (xhigh).
          $msi = Get-ChildItem "$targetDir/release/bundle/msi/*.msi"
          if (-not $msi) { throw 'no MSI produced' }
          $nsis = Get-ChildItem "$targetDir/release/bundle/nsis/*.exe"
          if (-not $nsis) { throw 'no NSIS installer produced' }
          $files = @($msi) + @($nsis) + @(Get-ChildItem "$targetDir/release/curated-thoughts.exe", "$targetDir/release/ct.exe", "src-tauri/binaries/curated-thoughts-mcp-x86_64-pc-windows-msvc.exe")
          $bad = $files | Where-Object { (Get-AuthenticodeSignature $_.FullName).Status -ne 'Valid' }
          $files | ForEach-Object { "{0}: {1}" -f $_.Name, (Get-AuthenticodeSignature $_.FullName).Status }
          if ($bad) { throw "Unsigned or invalid: $($bad.Name -join ', ')" }

      - name: Cleanup signing material (macOS)
        if: always() && matrix.platform == 'macos-latest'
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8 "$RUNNER_TEMP/cert.p12"

      - name: Upload ct release asset
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # bash syntax ($GITHUB_REF_NAME env-var expansion). pwsh would expand
        # "$GITHUB_REF_NAME" as an undefined PowerShell variable to "" and the
        # glob `ct_*.*` would never expand. Upload the EXACT filename from the
        # build step output instead of a glob so a partial matrix leg cannot
        # silently skip or double-upload.
        shell: bash
        run: |
          if [ -n "${{ steps.ctbuild.outputs.asset }}" ]; then
            gh release upload "$GITHUB_REF_NAME" "${{ steps.ctbuild.outputs.asset }}" --clobber
          else
            gh release upload "$GITHUB_REF_NAME" "${{ steps.ctbuildmac.outputs.asset }}" --clobber
          fi

  publish-release:
    # The release is created as a DRAFT — by semantic-release (`draftRelease:
    # true` in .releaserc.json) on the main release path, or by tauri-action
    # (releaseDraft: true above) on a human-pushed tag — and flips to public
    # only after EVERY matrix leg built, verified, and uploaded. A silently
    # unsigned/invalid artifact fails its leg and the release stays draft
    # (docs/release-signing.md gate promise). GITHUB_REF_NAME is the tag on
    # this trigger, which is also the release tag.
    needs: publish-tauri
    if: github.ref_type == 'tag' && success()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
