name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag || steps.tag_fallback.outputs.tag }}
    concurrency:
      group: release-main
      cancel-in-progress: false
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      !contains(github.event.workflow_run.head_commit.message, '[skip ci]')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Guard release to current main HEAD
        id: release_guard
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git fetch --no-tags origin main
          CURRENT_MAIN_SHA="$(git rev-parse origin/main)"

          if [ "$HEAD_SHA" != "$CURRENT_MAIN_SHA" ]; then
            echo "Skipping release: workflow_run head_sha ($HEAD_SHA) is not the current origin/main ($CURRENT_MAIN_SHA)."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should_release=true" >> "$GITHUB_OUTPUT"

      - name: Create branch reference for semantic-release
        if: steps.release_guard.outputs.should_release == 'true'
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: git checkout -B "$HEAD_BRANCH"

      - name: Configure git identity
        if: steps.release_guard.outputs.should_release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.release_guard.outputs.should_release == 'true'
        with:
          node-version: 22

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: steps.release_guard.outputs.should_release == 'true'
        with:
          run_install: false

      - name: Install dependencies
        if: steps.release_guard.outputs.should_release == 'true'
        run: pnpm install --frozen-lockfile

      - name: Run semantic-release
        id: release
        if: steps.release_guard.outputs.should_release == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release

      # Failure-path fallback for the tag: if a late phase of semantic-release
      # (e.g. @semantic-release/github publish) failed, the tag is already on
      # HEAD while successCmd never ran, so steps.release.outputs.tag is
      # empty. Resolve the tag from git so dispatch-build still fires. On a
      # no-release run HEAD carries no v* tag and this stays empty (checkout
      # is fetch-depth: 0, so all tags are present locally).
      - name: Resolve release tag from git (failure-path fallback)
        id: tag_fallback
        if: ${{ !cancelled() }}
        run: |
          TAG="$(git tag --points-at HEAD | grep '^v' | tail -1 || true)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  # Dispatches the Build workflow at the published release tag. The tag push
  # itself cannot trigger build.yml: tags pushed with GITHUB_TOKEN never fire
  # downstream workflows (GitHub's anti-recursion guard), but a
  # workflow_dispatch sent with GITHUB_TOKEN explicitly does.
  #
  # Gate: !cancelled() (not success) on purpose — @semantic-release/github's
  # success step (issue/PR comments, labels) runs AFTER the tag and Release
  # already exist; if it fails, the release still happened and the build must
  # still be dispatched. The tag output is only ever written by successCmd,
  # which semantic-release runs only after a release is actually published.
  #
  # actions: write lives on this job alone so the semantic-release plugin
  # process never holds it (it can cancel/rerun workflows, delete logs).
  dispatch-build:
    needs: release
    if: ${{ !cancelled() && needs.release.outputs.tag != '' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Trigger Build workflow at the release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release.outputs.tag }}
        run: gh workflow run build.yml --ref "$TAG"
