name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    concurrency:
      group: release-main
      cancel-in-progress: false
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      !contains(github.event.workflow_run.head_commit.message, '[skip ci]')
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Guard release to current main HEAD
        id: release_guard
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git fetch --no-tags origin main
          CURRENT_MAIN_SHA="$(git rev-parse origin/main)"

          if [ "$HEAD_SHA" != "$CURRENT_MAIN_SHA" ]; then
            echo "Skipping release: workflow_run head_sha ($HEAD_SHA) is not the current origin/main ($CURRENT_MAIN_SHA)."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should_release=true" >> "$GITHUB_OUTPUT"

      - name: Create branch reference for semantic-release
        if: steps.release_guard.outputs.should_release == 'true'
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: git checkout -B "$HEAD_BRANCH"

      - name: Configure git identity
        if: steps.release_guard.outputs.should_release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.release_guard.outputs.should_release == 'true'
        with:
          node-version: 22

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        if: steps.release_guard.outputs.should_release == 'true'
        with:
          run_install: false

      - name: Install dependencies
        if: steps.release_guard.outputs.should_release == 'true'
        run: pnpm install --frozen-lockfile

      - name: Run semantic-release
        if: steps.release_guard.outputs.should_release == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release
