[package]
name = "curated-thoughts"
default-run = "curated-thoughts"
version = "1.0.4"
description = "Curated Thoughts Tauri backend"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-os = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
notify = "6"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "1"
dirs = "5"
reqwest = { version = "0.12", features = ["blocking", "json"] }
sha2 = "0.10"
hex = "0.4"
fastembed = "4"
flate2 = "1"
walkdir = "2"
pdf-extract = "0.10.0"
zip = "8.6.0"
tree-sitter = { version = "0.26.8", default-features = false }
tree-sitter-rust = { version = "0.24.2", default-features = false }
tree-sitter-typescript = { version = "0.23.2", default-features = false }
tree-sitter-javascript = { version = "0.25.0", default-features = false }
tree-sitter-python = { version = "0.25.0", default-features = false }
tree-sitter-go = { version = "0.25.0", default-features = false }

[dev-dependencies]
tempfile = "3"
mockito = "1"
temp-env = "0.3"
anyhow = "1"
rmcp = { version = "1.6", features = ["client", "transport-child-process"] }

[features]
test-utils = ["tauri/test"]
slow-tests = []

