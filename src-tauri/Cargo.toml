[package]
name = "curated-thoughts"
default-run = "curated-thoughts"
version = "1.37.0"
description = "Curated Thoughts Tauri backend"
authors = ["you"]
edition = "2021"
autobins = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-os = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
notify = "6"
tokio = { version = "1", features = ["full", "test-util"] }
anyhow = "1"
thiserror = "2"
dirs = "6"
reqwest = { version = "0.13", features = ["blocking", "json"] }
sha2 = "0.11"
hex = "0.4"
regex = "1"
serde_yaml = "0.9"
portpicker = "0.1"
fastembed = "4"
flate2 = "1"
fs4 = "0.7"
walkdir = "2"
pdf-extract = "0.10.0"
zip = "8.6.0"
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio-native-tls", "json"] }
tree-sitter = { version = "0.26.8", default-features = false }
tree-sitter-rust = { version = "0.24.2", default-features = false }
tree-sitter-typescript = { version = "0.23.2", default-features = false }
tree-sitter-javascript = { version = "0.25.0", default-features = false }
tree-sitter-python = { version = "0.25.0", default-features = false }
tree-sitter-go = { version = "0.25.0", default-features = false }
rmcp = { version = "3.1", features = ["macros", "transport-io", "schemars"], optional = true }
schemars = { version = "1", features = ["derive"], optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", optional = true }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
http = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
rand = "0.10"
tauri-plugin-notification = "2.3.3"
uuid = { version = "1.6", features = ["v4", "fast-rng"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[dev-dependencies]
tempfile = "3"
mockito = "1"
temp-env = "0.3"
anyhow = "1"
rmcp = { version = "3.1", features = ["client", "transport-child-process"] }
uuid = { version = "1", features = ["v4"] }

[features]
test-utils = ["tauri/test"]
slow-tests = []
mcp-server = ["dep:rmcp", "dep:schemars", "dep:tracing", "dep:tracing-subscriber"]

[[bin]]
name = "curated-thoughts"
path = "src/main.rs"
